[package]
name = "py_feos"
edition.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "FeOs - A framework for equations of state and classical density functional theory."

[lib]
name = "feos"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = [
    "multiple-pymethods",
    "indexmap"
] }
pythonize = "0.29"
numpy = { version = "0.29" }

quantity = { workspace = true, features = ["python", "python_numpy"] }
num-dual = { workspace = true, features = ["python_macro"] }
nalgebra = { workspace = true }
ndarray = { workspace = true }
petgraph = { workspace = true, optional = true }
thiserror = { workspace = true }
conv = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
rayon = { workspace = true, optional = true }
itertools = { workspace = true }
paste = { workspace = true }
# Gated behind the `sqlite` feature, off for the wasm build.
rusqlite = { workspace = true, features = ["bundled"], optional = true }

feos = { workspace = true }
feos-core = { workspace = true, features = ["ndarray"] }
feos-derive = { workspace = true }
feos-dft = { workspace = true, optional = true }

[features]
default = []
dft = ["feos/dft", "feos-dft", "petgraph"]
pcsaft = ["feos/pcsaft"]
epcsaft = ["feos/epcsaft"]
gc_pcsaft = ["feos/gc_pcsaft"]
uvtheory = ["feos/uvtheory"]
pets = ["feos/pets"]
saftvrqmie = ["feos/saftvrqmie"]
saftvrmie = ["feos/saftvrmie"]
multiparameter = ["feos/multiparameter"]
# All parallelism is gated behind this feature. Not active for emscripten wheel.
rayon = ["dep:rayon", "ndarray/rayon", "feos-core/rayon", "feos-dft?/rayon"]
# Loading parameters from a sqlite database. Not active for emscripten wheel.
sqlite = ["dep:rusqlite", "feos-core/rusqlite"]
ad = ["feos/pcsaft"]
# EoS and DFT model implementations.
all_models = [
    "dft",
    "pcsaft",
    "epcsaft",
    "gc_pcsaft",
    "uvtheory",
    "pets",
    "saftvrqmie",
    "saftvrmie",
    "multiparameter"
]
# Features for native Python wheel, including parallelism.
wheel = [
    "pyo3/extension-module",
    "pyo3/abi3-py310",
    "all_models",
    "ad",
    "rayon",
    "sqlite"
]
# Features for threadless, portable wheel for Pyodide.
emscripten_wheel = [
    "pyo3/extension-module",
    "pyo3/abi3-py310",
    "all_models",
    "ad"
]

[dev-dependencies]
tempfile = "3.24.0"
