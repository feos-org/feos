[package]
name = "py_feos"
edition.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "FeOs - A framework for equations of state and classical density functional theory."

[lib]
name = "feos"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = [
    "multiple-pymethods",
    "indexmap"
] }
pythonize = "0.29"
numpy = { version = "0.29" }

quantity = { workspace = true, features = ["python", "python_numpy"] }
num-dual = { workspace = true, features = ["python_macro"] }
nalgebra = { workspace = true }
ndarray = { workspace = true }
petgraph = { workspace = true, optional = true }
thiserror = { workspace = true }
conv = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
rayon = { workspace = true, optional = true }
itertools = { workspace = true }
paste = { workspace = true }
# Optional: the `bundled` sqlite is C compiled to wasm and its build script
# uses the unstable `cfg_select` feature, which the pinned-stable emscripten
# toolchain rejects. Gated behind the `sqlite` feature, off for the wasm build.
rusqlite = { workspace = true, features = ["bundled"], optional = true }

feos = { workspace = true }
feos-core = { workspace = true, features = ["ndarray"] }
feos-derive = { workspace = true }
feos-dft = { workspace = true, optional = true }

[features]
default = []
# `dft` no longer pulls in `rayon`: the wasm32-unknown-emscripten target has no
# pthreads, so the emscripten wheel is built without the `rayon` feature. The
# rayon-gated 3D-FFT DFT classes (Pore3D/PoreProfile3D/Adsorption3D,
# SolvationProfile, PairCorrelation) are cfg-gated out of that build. Native
# builds re-enable everything via `all_models` (which lists `rayon` below).
dft = ["feos/dft", "feos-dft", "petgraph"]
pcsaft = ["feos/pcsaft"]
epcsaft = ["feos/epcsaft"]
gc_pcsaft = ["feos/gc_pcsaft"]
uvtheory = ["feos/uvtheory"]
pets = ["feos/pets"]
saftvrqmie = ["feos/saftvrqmie"]
saftvrmie = ["feos/saftvrmie"]
multiparameter = ["feos/multiparameter"]
rayon = ["dep:rayon", "ndarray/rayon", "feos-core/rayon", "feos-dft?/rayon"]
# Loading parameters from a sqlite database; omitted from the wasm build.
sqlite = ["dep:rusqlite", "feos-core/rusqlite"]
ad = ["feos-core/rayon", "feos/pcsaft"]
all_models = [
    "dft",
    "pcsaft",
    "epcsaft",
    "gc_pcsaft",
    "uvtheory",
    "pets",
    "saftvrqmie",
    "saftvrmie",
    "multiparameter",
    "ad",
    "rayon",
    "sqlite"
]

[dev-dependencies]
tempfile = "3.24.0"
